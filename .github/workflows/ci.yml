name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: jobs only need to read the repo.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          python-version: "3.13"
          enable-cache: true
      # Runs the exact hooks from .pre-commit-config.yaml (ruff, ruff-format,
      # mypy, hygiene), so CI and local pre-commit stay in lock-step.
      - name: Run pre-commit
        run: uvx pre-commit run --all-files --show-diff-on-failure

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Run tests (with coverage gate)
        run: uv run --group dev pytest --cov=tools --cov-report=xml
      # Publish the coverage % to a Gist so the README badge can read it.
      # Runs only on main (not PRs) so the badge tracks the released state.
      - name: Extract coverage percentage
        if: github.ref == 'refs/heads/main'
        id: cov
        run: |
          pct=$(uv run --group dev python -c \
            "import xml.etree.ElementTree as ET; print(round(float(ET.parse('coverage.xml').getroot().get('line-rate')) * 100))")
          echo "pct=$pct" >> "$GITHUB_OUTPUT"
      - name: Update coverage badge gist
        if: github.ref == 'refs/heads/main'
        uses: schneegans/dynamic-badges-action@e9a478b16159b4d31420099ba146cdc50f134483  # v1.7.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: ab179799bf4df9083c5a72975b6e6c14
          filename: lora-tools-coverage.json
          label: coverage
          message: ${{ steps.cov.outputs.pct }}%
          # Colour ramps red→green across this range as the percentage climbs.
          valColorRange: ${{ steps.cov.outputs.pct }}
          minColorRange: 50
          maxColorRange: 90

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
      - name: Audit runtime dependencies
        run: |
          uv export --no-dev --no-emit-project --format requirements-txt > requirements.txt
          uvx pip-audit -r requirements.txt
