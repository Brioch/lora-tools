# Install the git hook:   uvx pre-commit install
# Run on all files:       uvx pre-commit run --all-files
# Bump hook versions:     uvx pre-commit autoupdate
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-toml
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff          # lint
        args: [--fix]
      - id: ruff-format   # format

  # mypy runs through uv so it uses the project's pinned version and dev group.
  # pass_filenames is off so it always type-checks the paths in [tool.mypy].
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run --group dev mypy
        language: system
        types: [python]
        pass_filenames: false
