[project]
name = "lora-tools"
version = "0.1.0"
description = "Command-line tools for inspecting and editing LoRA safetensors metadata and planning training runs"
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Brioch" }]
license = "MIT"
license-files = ["LICENCE"]
keywords = ["lora", "lokr", "safetensors", "stable-diffusion", "modelspec", "comfyui"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=2.1",
    "pillow>=12.3.0",
]

[project.urls]
Repository = "https://github.com/Brioch/lora-tools"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=6",
    "mypy>=1.13",
]

[tool.uv]
# A collection of standalone scripts, not a build/publish target.
package = false

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
# Ruff's default rules (pyflakes + a curated pycodestyle subset) plus import
# sorting. Line-length (E501) and whitespace rules are intentionally left to
# the formatter, so `ruff check` and `ruff format` never disagree.
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The tools/ scripts aren't a package; put them on the path so tests import them.
pythonpath = ["tools"]

[tool.mypy]
files = ["tools"]
python_version = "3.13"
strict = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["tools"]

[tool.coverage.report]
show_missing = true
fail_under = 90
exclude_also = [
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
