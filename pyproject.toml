[project]
name = "lora-tools"
version = "0.1.0"
description = "Command-line tools for inspecting and editing LoRA safetensors metadata and planning training runs"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pillow>=12.3.0",
]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
# Ruff's default rules (pyflakes + a curated pycodestyle subset) plus import
# sorting. Line-length (E501) and whitespace rules are intentionally left to
# the formatter, so `ruff check` and `ruff format` never disagree.
select = ["E4", "E7", "E9", "F", "I"]
